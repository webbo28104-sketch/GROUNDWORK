name: Pick up nightly discovery results from Drive (manual fallback)

# REMOVED the scheduled trigger 2026-07-19: same GitHub Actions scheduling
# unreliability documented in export-pending-batch.yml (this one actually
# ran ~2h15m late its first night, 08:15 instead of 06:00 UTC). The
# scheduled pickup now runs on Railway Cron instead
# (outreach/pickup_drive_results.py, same script, just triggered
# reliably) — same dedicated infrastructure every other job in this
# pipeline uses. This workflow is kept only as a manual `workflow_dispatch`
# fallback.
#
# Safe to run even if the routine hasn't produced a new file that night —
# outreach/pickup_drive_results.py just logs "nothing new" and exits 0.
on:
  workflow_dispatch: {}

jobs:
  pickup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install sqlalchemy psycopg2-binary dnspython requests

      - name: Pick up and import latest Drive results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python outreach/pickup_drive_results.py
