name: Export pending discovery batch (manual fallback)

# REMOVED the scheduled trigger 2026-07-19: GitHub deprioritizes scheduled
# Actions on low-traffic repos, and this one was observed running 2.5-3
# hours late two nights running (2026-07-18, 2026-07-19) — late enough
# that the discovery routine (fires at 03:30 UTC sharp) read a stale
# pending_batch.json instead of that night's fresh export, silently
# processing 0 prospects. The scheduled export now runs on Railway Cron
# instead (outreach/export_and_push_pending_batch.py, pushes via the
# GitHub Contents API rather than a local git push) — same dedicated,
# reliably-on-time infrastructure every other job in this pipeline uses.
# This workflow is kept only as a manual `workflow_dispatch` fallback.
#
# Pushes straight to main using the auto-provided GITHUB_TOKEN (declared
# contents:write below) — no separate credential needed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install sqlalchemy psycopg2-binary dnspython

      - name: Export fresh pending batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # High cap, not a real limit — the point is "export the whole
        # backlog," not "cap it at 20." 2000 comfortably covers the
        # current ~200-prospect queue plus months of growth; the routine
        # runs overnight with nothing else competing for its time, so it
        # should work the full list until it's done or hits its own
        # usage limit, not stop artificially early.
        run: python outreach/export_pending_batch.py --limit 2000

      - name: Commit and push
        run: |
          git config user.name "groundwork-discovery-bot"
          git config user.email "actions@github.com"
          git add outreach/discovery_batches/pending_batch.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Nightly pending batch export ($(date -u +%Y-%m-%d))"
          git push
