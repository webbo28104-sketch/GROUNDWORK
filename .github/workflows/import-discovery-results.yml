name: Import nightly discovery results

# Fires automatically whenever the discovery routine pushes results to its
# dedicated branch (added 2026-07-18 — see docs/outreach-pipeline-spec.md
# Section 4a). Deliberately NOT triggered on pushes to main; the routine
# only ever pushes to this one branch, so scoping the trigger this tightly
# means this workflow can't fire from unrelated commits.
#
# Runs on GitHub's own runners — normal, unrestricted network access, so
# this is unaffected by anything that blocked the discovery routine's own
# WebFetch calls or the CCR sandbox's git-push permissions tonight.
on:
  push:
    branches:
      - claude/nightly-discovery-results

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: pip install sqlalchemy psycopg2-binary dnspython

      - name: Import discovery results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python outreach/import_discovery_results.py
